<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Universe Wallpaper — ZAURIVA</title>

    <meta name="description"
          content="Download the ZAURIVA Universe 4K wallpaper.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        header {
            padding: 25px 6%;
            border-bottom: 1px solid #222;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 60px 20px;
        }

        .back {
            display: inline-block;
            color: #999;
            text-decoration: none;
            margin-bottom: 35px;
            font-size: 14px;
        }

        .wallpaper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .preview {
            background: #151515;
            border-radius: 18px;
            overflow: hidden;
        }

        .preview img {
            width: 100%;
            display: block;
        }

        .info h1 {
            font-size: 42px;
            margin-bottom: 18px;
        }

        .info p {
            color: #999;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .details {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .tag {
            border: 1px solid #292929;
            padding: 9px 14px;
            border-radius: 20px;
            color: #ccc;
            font-size: 13px;
        }

        .download {
            display: inline-block;
            background: white;
            color: black;
            text-decoration: none;
            padding: 16px 30px;
            border-radius: 30px;
            font-weight: 600;
        }

        .download:hover {
            opacity: 0.85;
        }

        @media (max-width: 750px) {
            .wallpaper {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .info h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">ZAURIVA</a>
</header>

<main class="container">

    <a href="index.html" class="back">← Back to ZAURIVA</a>

    <div class="wallpaper">

        <div class="preview">
            <img
                src="011 upscaled.jpeg"
                alt="ZAURIVA Universe Wallpaper">
        </div>

        <div class="info">

            <h1>Universe</h1>

            <p>
                Explore the infinite. A cinematic universe wallpaper
                created for the ZAURIVA collection.
            </p>

            <div class="details">
                <span class="tag">Universe</span>
                <span class="tag">4K</span>
                <span class="tag">Mobile</span>
                <span class="tag">9:16</span>
            </div>

            <a
                class="download"
                href="017 upscaled.jpeg"
                download>
                Download Wallpaper
            </a>

        </div>

    </div>

</main>

</body>
</html>
