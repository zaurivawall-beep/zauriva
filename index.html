<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZAURIVA — Wallpapers for Every Screen</title>

    <meta name="description"
          content="Discover beautiful wallpapers for your phone, tablet and desktop.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #ffffff;
        }

        header {
            padding: 25px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
        }

        .hero {
            text-align: center;
            padding: 90px 20px 70px;
        }

        .hero h1 {
            font-size: clamp(42px, 7vw, 78px);
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        .hero p {
            color: #a5a5a5;
            font-size: 17px;
            margin-bottom: 35px;
        }

        .search {
            width: min(600px, 90%);
            margin: auto;
            display: flex;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 50px;
            padding: 6px;
        }

        .search input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            padding: 15px 20px;
            font-size: 15px;
        }

        .search button {
            border: none;
            background: white;
            color: black;
            padding: 0 25px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        section {
            padding: 50px 6%;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-title h2 {
            font-size: 25px;
        }

        .section-title a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        .wallpapers {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .wallpaper {
            overflow: hidden;
            border-radius: 14px;
            background: #151515;
            cursor: pointer;
        }

        .wallpaper img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .wallpaper:hover img {
            transform: scale(1.04);
        }

        .categories {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .category {
            padding: 13px 20px;
            border: 1px solid #292929;
            border-radius: 30px;
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
        }

        .category:hover {
            background: #ffffff;
            color: #000000;
        }

        footer {
            text-align: center;
            padding: 50px 20px;
            border-top: 1px solid #222;
            color: #777;
            margin-top: 50px;
        }

        @media (max-width: 900px) {
            .wallpapers {
                grid-template-columns: repeat(2, 1fr);
            }

            nav {
                display: none;
            }
        }

        @media (max-width: 500px) {
            .wallpapers {
                grid-template-columns: 1fr;
            }

            .hero {
                padding-top: 60px;
            }

            .wallpaper img {
                height: 420px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ZAURIVA</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Explore</a>
        <a href="#">Categories</a>
    </nav>
</header>

<main>

    <section class="hero">

        <h1>Your screen.<br>Your world.</h1>

        <p>
            Discover beautiful wallpapers made for every screen.
        </p>

        <div class="search">
            <input
                type="text"
                placeholder="Search wallpapers..."
            >

            <button>Search</button>
        </div>

    </section>


    <section>

        <div class="section-title">
            <h2>Trending Wallpapers</h2>
            <a href="#">View all →</a>
        </div>

        <div class="wallpapers">

            <div class="wallpaper">
                <img
    src="universe-001.jpg"
    alt="Universe wallpaper">
            </div>

            <div class="wallpaper">
                <a href="wallpaper.html">
    <img
        src="universe-001-v2.jpg"
        alt="ZAURIVA Universe Wallpaper">
</a>
            </div>

            <div class="wallpaper">
                <img
                    src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80"
                    alt="Nature wallpaper">
            </div>

            <div class="wallpaper">
                <img
                    src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80"
                    alt="Landscape wallpaper">
            </div>

        </div>

    </section>


    <section>

        <div class="section-title">
            <h2>Explore Categories</h2>
        </div>

        <div class="categories">

            <a class="category" href="#">Aesthetic</a>
            <a class="category" href="#">Nature</a>
            <a class="category" href="#">Cars</a>
            <a class="category" href="#">Spiritual</a>
            <a class="category" href="#">Anime</a>
            <a class="category" href="#">Gaming</a>
            <a class="category" href="#">Dark</a>
            <a class="category" href="#">Minimal</a>

        </div>

    </section>

</main>


<footer>

    © 2026 ZAURIVA — Wallpapers for Every Screen

</footer>

</body>
</html>
